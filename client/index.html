<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aprameya — Autonomous Systems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght,wdth@12..96,200..800,75..100&family=JetBrains+Mono:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <script>
    (function () {
      try {
        const storedTheme = localStorage.getItem("aprameya-theme") || localStorage.getItem("vite-ui-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = storedTheme === "light" ? "light" : (storedTheme === "dark" ? "dark" : (prefersDark ? "dark" : "light"));
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    (function () {
      const link = document.querySelector("link[rel*='icon']") || document.createElement('link');
      link.type = 'image/png';
      link.rel = 'icon';
      document.head.appendChild(link);

      function updateFavicon() {
        const theme = document.documentElement.getAttribute('data-theme');
        if (theme === 'light') {
          link.href = '/logo-black.png';
        } else {
          link.href = '/logo-white.png';
        }
      }

      updateFavicon();
      const observer = new MutationObserver(updateFavicon);
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    })();
  </script>
</body>

</html>
