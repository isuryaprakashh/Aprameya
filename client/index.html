<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aprameya</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    (function () {
      const link = document.querySelector("link[rel*='icon']") || document.createElement('link');
      link.type = 'image/png';
      link.rel = 'icon';
      document.head.appendChild(link);

      function updateFavicon() {
        const theme = document.documentElement.getAttribute('data-theme');
        // Light Theme (Light BG) -> Use Black Logo
        // Dark Theme (Dark BG) -> Use White Logo
        if (theme === 'light') {
          link.href = '/logo-black.png';
        } else {
          link.href = '/logo-white.png';
        }
      }

      // Initial check
      updateFavicon();

      // Watch for theme changes
      const observer = new MutationObserver(updateFavicon);
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    })();
  </script>
</body>

</html>
